<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>淡红白番茄钟</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1>番茄钟</h1>
      <p>选择工作与休息时间，精确到秒</p>
    </header>

    <section class="timer" aria-live="polite">
      <div class="timer__display" id="timerDisplay">25:00</div>
      <div class="timer__status" id="timerStatus">工作模式</div>
    </section>

    <section class="controls">
      <div class="controls__group">
        <label for="workTime">工作时间</label>
        <input type="time" id="workTime" step="1" value="00:25:00" />
      </div>
      <div class="controls__group">
        <label for="restTime">休息时间</label>
        <input type="time" id="restTime" step="1" value="00:05:00" />
      </div>
      <div class="controls__group">
        <label for="modeSelect">当前模式</label>
        <select id="modeSelect">
          <option value="work" selected>工作</option>
          <option value="rest">休息</option>
        </select>
      </div>
    </section>

    <section class="buttons">
      <button id="startBtn" class="primary">开始</button>
      <button id="pauseBtn">暂停</button>
      <button id="resetBtn" class="ghost">重置</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
